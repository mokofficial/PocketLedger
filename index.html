const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const dayMs = 86400000;

function lastNDates(n, stepDays) {
  const arr = [];
  const base = new Date();
  base.setHours(0, 0, 0, 0);
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(base.getTime() - i * stepDays * dayMs);
    arr.push(d.toISOString().slice(0, 10));
  }
  return arr;
}
function lastNMonths(n) {
  const arr = [];
  const base = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
    arr.push(d.toISOString().slice(0, 10));
  }
  return arr;
}
function periodsForPlan(plan) {
  if (plan.frequency === 'daily') return lastNDates(10, 1);
  if (plan.frequency === 'weekly') return lastNDates(8, 7);
  return lastNMonths(6);
}
function periodLabel(period, frequency) {
  const d = new Date(period);
  if (frequency === 'monthly') return d.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function daysFromToday(dateStr) {
  return Math.ceil((new Date(dateStr) - new Date(todayISO())) / dayMs);
}
function dateFieldForKey(key) {
  return key === 'repayments' ? 'dateGiven' : 'dateReceived';
}
function accruedOf(item, key) {
  const rate = Number(item.interestRate || 0);
  if (!rate) return 0;
  const dateField = dateFieldForKey(key);
  const days = Math.max(0, Math.floor((new Date(todayISO()) - new Date(item[dateField])) / dayMs));
  return item.principal * (rate / 100) * (days / 365);
}
function paidOf(item, key) {
  return (item[key] || []).reduce((s, r) => s + Number(r.amount || 0), 0);
}
function totalOwedOf(item, key) {
  return item.principal + accruedOf(item, key);
}
function outstandingOf(item, key) {
  return Math.max(0, totalOwedOf(item, key) - paidOf(item, key));
}
function loanStatus(item, key) {
  const out = outstandingOf(item, key);
  if (out <= 0) return 'completed';
  if (daysFromToday(item.dueDate) < 0) return 'overdue';
  if (daysFromToday(item.dueDate) <= 7) return 'due-soon';
  return 'active';
}
const STATUS_LABEL = {
  completed: 'Cleared', overdue: 'Overdue', 'due-soon': 'Due soon', active: 'Active'
};
const CATEGORY_META = {
  Daily: { cls: 'tag-green' },
  Weekly: { cls: 'tag-gold' },
  Monthly: { cls: 'tag-steel' },
  Target: { cls: 'tag-ink' },
  Cycle: { cls: 'tag-brick' },
};
function cyclePot(plan) { return Number(plan.amount || 0) * (plan.memberIds || []).length; }
function cycleRoundsDone(plan) { return (plan.payouts || []).length; }
function cycleComplete(plan) { return (plan.memberIds || []).length > 0 && cycleRoundsDone(plan) >= plan.memberIds.length; }
function cycleCurrentRecipientId(plan) {
  if (cycleComplete(plan)) return null;
  return plan.memberIds[cycleRoundsDone(plan) % plan.memberIds.length];
}

function shareNodeImageToWhatsApp(elementId, filename, waHref) {
  const node = document.getElementById(elementId);
  if (!node || !window.html2canvas) { window.open(waHref, '_blank'); return; }
  window.html2canvas(node, { backgroundColor: '#F7F3EA', scale: 2 }).then((canvas) => {
    canvas.toBlob((blob) => {
      if (!blob) { window.open(waHref, '_blank'); return; }
      const file = new File([blob], filename, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(() => {});
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      window.open(waHref, '_blank');
    }, 'image/png');
  }).catch(() => window.open(waHref, '_blank'));
}

function ReceiptModal({ receipt, onClose, fmt, settings, planById, memberById, shareToWhatsApp, shareImageToWhatsApp }) {
  const isLoan = receipt.kind === 'loan';
  const isCycle = receipt.kind === 'cyclePayout';
  const receiptNo = isLoan ? receipt.payment.id.slice(0, 8).toUpperCase()
    : isCycle ? receipt.payout.id.slice(0, 8).toUpperCase()
    : receipt.contribution.id.slice(0, 8).toUpperCase();
  const issuedOn = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  let title, personName, personPhone, lines, waText;

  if (isLoan) {
    const { loan, key, personField, payment } = receipt;
    const accrued = accruedOf(loan, key);
    const paidTotal = paidOf(loan, key);
    const outstanding = outstandingOf(loan, key);
    personName = loan[personField];
    personPhone = loan.phone;
    title = key === 'repayments' ? 'Loan Repayment Receipt' : 'Loan Refund Receipt';
    lines = [
      ['Receipt No.', receiptNo],
      ['Date issued', issuedOn],
      [key === 'repayments' ? 'Received from' : 'Paid to', personName],
      ['Payment date', new Date(payment.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })],
      ['This payment', fmt(payment.amount)],
      ['divider', ''],
      ['Original principal', fmt(loan.principal)],
      ...(accrued > 0 ? [['Accrued interest', fmt(accrued)]] : []),
      ['Total paid to date', fmt(paidTotal)],
      ['Outstanding balance', fmt(outstanding)],
    ];
    waText = [
      `*${settings.businessName}* \u2014 ${title}`, '',
      `Receipt No: ${receiptNo}`,
      `${key === 'repayments' ? 'Received from' : 'Paid to'}: ${personName}`,
      `Amount: ${fmt(payment.amount)} on ${new Date(payment.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`,
      `Outstanding balance: ${fmt(outstanding)}`,
    ].join('\n');
  } else if (isCycle) {
    const { plan, payout } = receipt;
    const recipient = memberById(payout.memberId);
    personName = recipient ? recipient.name : 'Member';
    personPhone = recipient ? recipient.phone : '';
    title = 'Thrift Cycle Payout Receipt';
    lines = [
      ['Receipt No.', receiptNo],
      ['Date issued', issuedOn],
      ['Paid out to', personName],
      ['Plan', plan.name],
      ['Round', `${(plan.payouts || []).findIndex((p) => p.id === payout.id) + 1} of ${plan.memberIds.length}`],
      ['Payout date', new Date(payout.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })],
      ['Amount paid out', fmt(payout.amount)],
    ];
    waText = [
      `*${settings.businessName}* \u2014 ${title}`, '',
      `Receipt No: ${receiptNo}`,
      `Paid out to: ${personName}`,
      `Plan: ${plan.name}`,
      `Amount: ${fmt(payout.amount)} on ${new Date(payout.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`,
    ].join('\n');
  } else {
    const { member, contribution } = receipt;
    const plan = planById(contribution.planId);
    personName = member.name;
    personPhone = member.phone;
    title = 'Thrift Contribution Receipt';
    lines = [
      ['Receipt No.', receiptNo],
      ['Date issued', issuedOn],
      ['Contributor', personName],
      ['Plan', plan ? plan.name : 'N/A'],
      ['Category', plan ? plan.category : ''],
      ['Payment date', new Date(contribution.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })],
      ['Amount', fmt(contribution.amount)],
    ];
    waText = [
      `*${settings.businessName}* \u2014 ${title}`, '',
      `Receipt No: ${receiptNo}`,
      `Contributor: ${personName}`,
      `Plan: ${plan ? plan.name : 'N/A'}`,
      `Amount: ${fmt(contribution.amount)} on ${new Date(contribution.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`,
    ].join('\n');
  }

  const downloadImage = () => {
    const node = document.getElementById('receipt-print-area');
    if (!node || !window.html2canvas) return;
    window.html2canvas(node, { backgroundColor: '#F7F3EA', scale: 2 }).then((canvas) => {
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = `receipt-${receiptNo}.png`; a.click();
    });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card receipt-card" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3 className="kb-display">{title}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="modal-body">
          <div id="receipt-print-area" className="receipt-sheet">
            <div className="receipt-brand kb-display">{settings.businessName}</div>
            <div className="receipt-sub">{title}</div>
            <div className="receipt-lines">
              {lines.map(([label, value], i) => label === 'divider'
                ? <div key={i} className="receipt-divider" />
                : <div key={i} className="receipt-row"><span>{label}</span><span className="kb-mono">{value}</span></div>)}
            </div>
            <div className="receipt-footer">Issued {issuedOn}{settings.ownerName ? ` \u00b7 ${settings.ownerName}` : ''}</div>
          </div>
          <div className="receipt-actions">
            <button className="btn btn-outline btn-small" onClick={downloadImage}><ImageIcon size={14} /> Download image</button>
            <button className="btn btn-outline btn-small" onClick={() => window.print()}><Printer size={14} /> Print / Save PDF</button>
            <button className="btn btn-ghost btn-small" onClick={() => shareImageToWhatsApp(personPhone, waText, `receipt-${receiptNo}.png`)}><MessageCircle size={14} /> Share image on WhatsApp</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Carousel({ slides }) {
  const [index, setIndex] = useState(0);
  const timerRef = useRef(null);

  useEffect(() => {
    timerRef.current = setInterval(() => setIndex((i) => (i + 1) % slides.length), 5000);
    return () => clearInterval(timerRef.current);
  }, [slides.length]);

  const go = (i) => {
    clearInterval(timerRef.current);
    setIndex((i + slides.length) % slides.length);
    timerRef.current = setInterval(() => setIndex((x) => (x + 1) % slides.length), 5000);
  };

  const s = slides[index];
  return (
    <div className={`carousel tone-${s.tone}`}>
      <button className="carousel-arrow carousel-arrow-left" onClick={() => go(index - 1)}><ChevronRight size={16} style={{ transform: 'rotate(180deg)' }} /></button>
      <div className="carousel-slide">
        <div className="carousel-icon"><s.icon size={26} /></div>
        <div className="carousel-body">
          <div className="carousel-title kb-display">{s.title}</div>
          <div className="carousel-desc">{s.desc}</div>
        </div>
      </div>
      <button className="carousel-arrow carousel-arrow-right" onClick={() => go(index + 1)}><ChevronRight size={16} /></button>
      <div className="carousel-dots">
        {slides.map((_, i) => <button key={i} className={`carousel-dot ${i === index ? 'carousel-dot-active' : ''}`} onClick={() => go(i)} />)}
      </div>
    </div>
  );
}

  const fmt = (n) => settings.currencySymbol + Math.round(Number(n || 0)).toLocaleString('en-NG');
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3200); };
  const digitsOnly = (s) => (s || '').replace(/\D/g, '');
  const waHref = (phone, text) => {
    const digits = digitsOnly(phone);
    let number = '';
    if (digits) {
      if (digits.startsWith(settings.countryCode)) number = digits;
      else if (digits.startsWith('0')) number = settings.countryCode + digits.slice(1);
      else number = settings.countryCode + digits;
    }
    return `https://wa.me/${number}?text=${encodeURIComponent(text)}`;
  };
  const shareToWhatsApp = (phone, text) => window.open(waHref(phone, text), '_blank');

  /* ---------- lookups ---------- */
  const memberById = (id) => members.find((m) => m.id === id);
  const planById = (id) => plans.find((p) => p.id === id);
  const clientById = (id) => clients.find((c) => c.id === id);
  const invoiceById = (id) => invoices.find((i) => i.id === id);
  const findContribution = (planId, memberId, period) =>
    contributions.find((c) => c.planId === planId && c.memberId === memberId && c.period === period);
  const cycleCurrentPeriod = (plan) => { const periods = periodsForPlan(plan); return periods[periods.length - 1]; };
  const cyclePendingContributors = (plan) => {
    const period = cycleCurrentPeriod(plan);
    return plan.memberIds.filter((memberId) => !findContribution(plan.id, memberId, period));
  };

  const toggleContribution = (planId, memberId, period, amount) => {
    const existing = findContribution(planId, memberId, period);
    if (existing) {
      setContributions((prev) => prev.filter((c) => c.id !== existing.id));
    } else {
      setContributions((prev) => [...prev, { id: uid(), planId, memberId, period, amount, date: todayISO() }]);
    }
  };

  const planTotal = (planId) => contributions.filter((c) => c.planId === planId).reduce((s, c) => s + c.amount, 0);
  const memberTotal = (memberId) => contributions.filter((c) => c.memberId === memberId).reduce((s, c) => s + c.amount, 0);
  const memberConsistency = (memberId) => {
    const relevantPlans = plans.filter((p) => p.memberIds.includes(memberId));
    let due = 0, paid = 0;
    relevantPlans.forEach((p) => {
      const periods = periodsForPlan(p).slice(0, -1);
      due += periods.length;
      periods.forEach((period) => { if (findContribution(p.id, memberId, period)) paid += 1; });
    });
    return due > 0 ? Math.round((paid / due) * 100) : 100;
  };

  /* ---------- alerts ---------- */
  const alerts = useMemo(() => {
    const list = [];
    loansGiven.forEach((l) => {
      const status = loanStatus(l, 'repayments');
      if (status === 'overdue') list.push({ id: 'lg-' + l.id, severity: 'high', group: 'Loans given', text: `${l.borrower} is overdue by ${Math.abs(daysFromToday(l.dueDate))} day(s) \u2014 ${fmt(outstandingOf(l, 'repayments'))} outstanding.` });
      else if (status === 'due-soon') list.push({ id: 'lgs-' + l.id, severity: 'medium', group: 'Loans given', text: `${l.borrower}'s repayment is due in ${daysFromToday(l.dueDate)} day(s).` });
    });
    loansReceived.forEach((l) => {
      const status = loanStatus(l, 'refunds');
      if (status === 'overdue') list.push({ id: 'lr-' + l.id, severity: 'high', group: 'Loans received', text: `You are ${Math.abs(daysFromToday(l.dueDate))} day(s) overdue refunding ${l.lender} \u2014 ${fmt(outstandingOf(l, 'refunds'))} left.` });
      else if (status === 'due-soon') list.push({ id: 'lrs-' + l.id, severity: 'medium', group: 'Loans received', text: `Refund to ${l.lender} is due in ${daysFromToday(l.dueDate)} day(s).` });
    });
    plans.forEach((p) => {
      const periods = periodsForPlan(p).slice(0, -1);
      const recent = periods.slice(-3);
      p.memberIds.forEach((memberId) => {
        const missed = recent.filter((period) => !findContribution(p.id, memberId, period));
        if (missed.length >= 2) {
          list.push({ id: 'miss-' + p.id + memberId, severity: 'medium', group: 'Thrift contributions', text: `${memberById(memberId)?.name} has missed ${missed.length} of the last ${recent.length} rounds in ${p.name}.` });
        }
      });
    });
    invoices.forEach((inv) => {
      const status = invoiceStatusOf(inv);
      const client = clientById(inv.clientId);
      const name = client ? client.name : 'Client';
      if (status === 'overdue') list.push({ id: 'inv-' + inv.id, severity: 'high', group: 'Payments', text: `Invoice ${inv.number} to ${name} is overdue by ${Math.abs(daysFromToday(inv.dueDate))} day(s) \u2014 ${fmt(invoiceTotal(inv))} outstanding.` });
      else if (status === 'sent' && daysFromToday(inv.dueDate) <= 3) list.push({ id: 'invs-' + inv.id, severity: 'medium', group: 'Payments', text: `Invoice ${inv.number} to ${name} is due in ${daysFromToday(inv.dueDate)} day(s).` });
    });
    return list.filter((a) => !dismissed.includes(a.id));
  }, [loansGiven, loansReceived, plans, contributions, dismissed, invoices, clients]);

  /* ---------- dashboard derived data ---------- */
  const totalCollected = contributions.reduce((s, c) => s + c.amount, 0);
  const totalOwedToMe = loansGiven.reduce((s, l) => s + outstandingOf(l, 'repayments'), 0);
  const totalIOwe = loansReceived.reduce((s, l) => s + outstandingOf(l, 'refunds'), 0);
  const activePlansCount = plans.length;
  const cyclePlansCount = plans.filter((p) => p.category === 'Cycle' && !cycleComplete(p)).length;
  const totalInvoiced = invoices.reduce((s, i) => s + invoiceTotal(i), 0);
  const totalReceived = receipts.reduce((s, r) => s + r.amount, 0);
  const totalOutstanding = invoices.filter((i) => i.status !== 'paid').reduce((s, i) => s + invoiceTotal(i), 0);

      return [`"${memberById(memberId)?.name || ''}"`, ...cells].join(',');

    const csv = [header, ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });

    const a = document.createElement('a');
    a.href = url;

    const file = e.target.files[0];

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.members || !data.plans) throw new Error('Not a recognised PocketLedger backup file.');
        setMembers(data.members || []);
        setPlans(data.plans || []);
        setContributions(data.contributions || []);
        setLoansGiven(data.loansGiven || []);
        setLoansReceived(data.loansReceived || []);
        setClients(data.clients || []);
        setInvoices(data.invoices || []);
        setReceipts(data.receipts || []);
        if (data.settings) setSettings((s) => ({ ...s, ...data.settings }));
        flash('Backup imported successfully.');
      } catch (err) {
        flash('Could not read that file \u2014 is it a PocketLedger backup?');
      }
    };
    reader.readAsText(file);
    e.target.value = '';

  // Groups every loan by the person's name, so someone with several concurrent
  // loans (or loans taken at different times) shows as one person with a rolled-up
  // total, and each individual loan keeps its own separate repayment trail.
  const groupLoans = (list, personField, key) => {
    const dateField = personField === 'borrower' ? 'dateGiven' : 'dateReceived';
    const rank = { overdue: 0, 'due-soon': 1, active: 2, completed: 3 };
    const map = new Map();
    list.forEach((l) => {
      const name = (l[personField] || '').trim();
      const mapKey = name.toLowerCase();
      if (!map.has(mapKey)) map.set(mapKey, { name, loans: [] });
      map.get(mapKey).loans.push(l);
    });
    const groups = Array.from(map.values()).map((g) => {
      const loans = [...g.loans].sort((a, b) => new Date(b[dateField]) - new Date(a[dateField]));
      const totalPrincipal = loans.reduce((s, l) => s + l.principal, 0);
      const totalOutstanding = loans.reduce((s, l) => s + outstandingOf(l, key), 0);
      const worstRank = Math.min(...loans.map((l) => rank[loanStatus(l, key)]));
      return { name: g.name, loans, totalPrincipal, totalOutstanding, worstRank };
    });
    groups.sort((a, b) => a.worstRank - b.worstRank || b.totalOutstanding - a.totalOutstanding);
    return groups;
  };

                            {l.note && <div className="loan-note">\u201c{l.note}\u201d</div>}

            </div>
            <div className="field"><label>Interest (% per year, optional)</label>
              <input type="number" className="kb-input" value={form.interestRate || ''} onChange={(e) => setField('interestRate', e.target.value)} placeholder="0" />
            </div>
          </div>
          <div className="field"><label>Phone (for WhatsApp reminders, optional)</label>
            <input className="kb-input" value={form.phone || ''} onChange={(e) => setField('phone', e.target.value)} placeholder="080\u2026" />
          </div>
          <div className="field"><label>Link to a thrift plan (optional)</label>
            <select className="kb-input" value={form.linkedPlanId || ''} onChange={(e) => setField('linkedPlanId', e.target.value)}>
              <option value="">No linked plan</option>
              {plans.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div className="field"><label>Note</label>
            <input className="kb-input" value={form.note || ''} onChange={(e) => setField('note', e.target.value)} placeholder="What was this loan for?" />
          </div>
          <button className="btn btn-primary" onClick={submitNewLoanReceived}>Save loan</button>
        </Modal>
      )}
      {modal === 'newClient' && (
        <Modal title="Add client" onClose={closeModal}>
          <div className="field"><label>Client / business name</label>
            <input className="kb-input" value={form.name || ''} onChange={(e) => setField('name', e.target.value)} placeholder="e.g. Bright Star Ventures" />
          </div>
          <div className="field"><label>Phone number</label>
            <input className="kb-input" value={form.phone || ''} onChange={(e) => setField('phone', e.target.value)} placeholder="080\u2026" />
          </div>
          <div className="field"><label>Email (optional)</label>
            <input className="kb-input" value={form.email || ''} onChange={(e) => setField('email', e.target.value)} placeholder="client@example.com" />
          </div>
          <div className="field"><label>Address (optional)</label>
            <input className="kb-input" value={form.address || ''} onChange={(e) => setField('address', e.target.value)} placeholder="Delivery / billing address" />
          </div>
          <button className="btn btn-primary" onClick={submitNewClient}>Add client</button>
        </Modal>
      )}

      {modal === 'newInvoice' && (
        <Modal title="New invoice" onClose={closeModal}>
          <div className="field"><label>Client</label>
            <select className="kb-input" value={form.clientId || ''} onChange={(e) => setField('clientId', e.target.value)}>
              <option value="">Select a client</option>
              {clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div className="field-row">
            <div className="field"><label>Issue date</label>
              <input type="date" className="kb-input" value={form.issueDate || todayISO()} onChange={(e) => setField('issueDate', e.target.value)} />
            </div>
            <div className="field"><label>Due date</label>
              <input type="date" className="kb-input" value={form.dueDate || ''} onChange={(e) => setField('dueDate', e.target.value)} />
            </div>
          </div>
          <div className="field">
            <label>Line items</label>
            <div className="invoice-items-edit">
              {(form.items || []).map((it) => (
                <div key={it.id} className="invoice-item-row">
                  <input className="kb-input" placeholder="Description" value={it.desc} onChange={(e) => updateInvoiceItem(it.id, 'desc', e.target.value)} style={{ flex: 2 }} />
                  <input type="number" className="kb-input" placeholder="Qty" value={it.qty} onChange={(e) => updateInvoiceItem(it.id, 'qty', e.target.value)} style={{ width: 60 }} />
                  <input type="number" className="kb-input" placeholder="Price" value={it.price} onChange={(e) => updateInvoiceItem(it.id, 'price', e.target.value)} style={{ width: 100 }} />
                  <button className="icon-btn" onClick={() => removeInvoiceItem(it.id)}><X size={15} /></button>
                </div>
              ))}
            </div>
            <button className="btn btn-outline btn-small" style={{ marginTop: 8 }} onClick={addInvoiceItem}><Plus size={13} /> Add line item</button>
          </div>
          <div className="field-hint" style={{ textAlign: 'right', fontSize: 13, fontWeight: 600, color: 'var(--ink)' }}>
            Total: {fmt((form.items || []).reduce((s, it) => s + Number(it.qty || 0) * Number(it.price || 0), 0))}
          </div>
          <div className="field"><label>Notes (optional)</label>
            <input className="kb-input" value={form.notes || ''} onChange={(e) => setField('notes', e.target.value)} placeholder="Thank you for your business." />
          </div>
          <button className="btn btn-primary" onClick={submitNewInvoice}>Create invoice</button>
        </Modal>
      )}

      {modal === 'newReceipt' && (
        <Modal title="Issue receipt" onClose={closeModal}>
          <div className="field"><label>Client (optional)</label>
            <select className="kb-input" value={form.clientId || ''} onChange={(e) => setField('clientId', e.target.value)}>
              <option value="">Walk-in / type name below</option>
              {clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          {!form.clientId && (
            <div className="field"><label>Payer name</label>
              <input className="kb-input" value={form.clientName || ''} onChange={(e) => setField('clientName', e.target.value)} placeholder="e.g. Walk-in customer" />
            </div>
          )}
          <div className="field-row">
            <div className="field"><label>Amount received</label>
              <input type="number" className="kb-input" value={form.amount || ''} onChange={(e) => setField('amount', e.target.value)} placeholder="25000" />
            </div>
            <div className="field"><label>Date</label>
              <input type="date" className="kb-input" value={form.date || todayISO()} onChange={(e) => setField('date', e.target.value)} />
            </div>
          </div>
          <div className="field"><label>Note (optional)</label>
            <input className="kb-input" value={form.note || ''} onChange={(e) => setField('note', e.target.value)} placeholder="What was this payment for?" />
          </div>
          <button className="btn btn-primary" onClick={submitManualReceipt}>Issue receipt</button>
        </Modal>
      )}

      {receipt && <ReceiptModal receipt={receipt} onClose={() => setReceipt(null)} fmt={fmt} settings={settings} memberById={memberById} planById={planById} shareToWhatsApp={shareToWhatsApp} shareImageToWhatsApp={shareImageToWhatsApp} />}
      {invoiceDoc && (
        <InvoiceDocModal
          invoice={invoiceDoc}
          client={clientById(invoiceDoc.clientId)}
          settings={settings}
          fmt={fmt}
          onClose={() => setInvoiceDoc(null)}
          onMarkPaid={(id) => { markInvoicePaid(id); setInvoiceDoc((d) => d ? { ...d, status: 'paid', paidDate: todayISO() } : d); }}
          shareToWhatsApp={shareToWhatsApp}
          shareImageToWhatsApp={shareImageToWhatsApp}
          message={invoiceMessage(invoiceDoc)}
        />
      )}
      {paymentReceiptDoc && (
        <PaymentReceiptModal
          receiptDoc={paymentReceiptDoc}
          client={clientById(paymentReceiptDoc.clientId)}
          invoice={paymentReceiptDoc.invoiceId ? invoiceById(paymentReceiptDoc.invoiceId) : null}
          settings={settings}
          fmt={fmt}
          onClose={() => setPaymentReceiptDoc(null)}
          shareToWhatsApp={shareToWhatsApp}
          shareImageToWhatsApp={shareImageToWhatsApp}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', {
            scope: './'
        });
    });
}
</script>
</body>
</html>
