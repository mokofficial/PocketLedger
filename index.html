const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const dayMs = 86400000;

function lastNDates(n, stepDays) {
  const arr = [];
  const base = new Date();
  base.setHours(0, 0, 0, 0);
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(base.getTime() - i * stepDays * dayMs);
    arr.push(d.toISOString().slice(0, 10));
  }
  return arr;
}
function lastNMonths(n) {
  const arr = [];
  const base = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
    arr.push(d.toISOString().slice(0, 10));
  }
  return arr;
}
function periodsForPlan(plan) {
  if (plan.frequency === 'daily') return lastNDates(10, 1);
  if (plan.frequency === 'weekly') return lastNDates(8, 7);
  return lastNMonths(6);
}
function periodLabel(period, frequency) {
  const d = new Date(period);
  if (frequency === 'monthly') return d.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function daysFromToday(dateStr) {
  return Math.ceil((new Date(dateStr) - new Date(todayISO())) / dayMs);
}
function dateFieldForKey(key) {
  return key === 'repayments' ? 'dateGiven' : 'dateReceived';
}
function accruedOf(item, key) {
  const rate = Number(item.interestRate || 0);
  if (!rate) return 0;
  const dateField = dateFieldForKey(key);
  const days = Math.max(0, Math.floor((new Date(todayISO()) - new Date(item[dateField])) / dayMs));
  return item.principal * (rate / 100) * (days / 365);
}
function paidOf(item, key) {
  return (item[key] || []).reduce((s, r) => s + Number(r.amount || 0), 0);
}
function totalOwedOf(item, key) {
  return item.principal + accruedOf(item, key);
}
function outstandingOf(item, key) {
  return Math.max(0, totalOwedOf(item, key) - paidOf(item, key));
}
function loanStatus(item, key) {
  const out = outstandingOf(item, key);
  if (out <= 0) return 'completed';
  if (daysFromToday(item.dueDate) < 0) return 'overdue';
  if (daysFromToday(item.dueDate) <= 7) return 'due-soon';
  return 'active';
}

function cyclePot(plan) { return Number(plan.amount || 0) * (plan.memberIds || []).length; }
function cycleRoundsDone(plan) { return (plan.payouts || []).length; }
function cycleComplete(plan) { return (plan.memberIds || []).length > 0 && cycleRoundsDone(plan) >= plan.memberIds.length; }
function cycleCurrentRecipientId(plan) {
  if (cycleComplete(plan)) return null;
  return plan.memberIds[cycleRoundsDone(plan) % plan.memberIds.length];
}

function shareNodeImageToWhatsApp(elementId, filename, waHref) {
  const node = document.getElementById(elementId);
  if (!node || !window.html2canvas) { window.open(waHref, '_blank'); return; }
  window.html2canvas(node, { backgroundColor: '#F7F3EA', scale: 2 }).then((canvas) => {
    canvas.toBlob((blob) => {
      if (!blob) { window.open(waHref, '_blank'); return; }
      const file = new File([blob], filename, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(() => {});
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      window.open(waHref, '_blank');
    }, 'image/png');
  }).catch(() => window.open(waHref, '_blank'));
}
